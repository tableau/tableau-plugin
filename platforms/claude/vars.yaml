# Claude platform variables: the Claude apps (web, Desktop Chat, Cowork), which
# share one plugin format (.claude-plugin/). Consumed by build/build.py when
# rendering *.j2 files from src/plugin/.
#
# Values tagged VERIFY still need confirming in a real Claude app install.

# How the assistant refers to itself in user-facing prose.
assistant_name: Claude

# Empty on purpose. In the Claude apps the Tableau connector's tools get a
# host-assigned prefix that isn't predictable from the plugin (e.g.
# mcp__<connector-uuid>__search-content), so skills name tools by base name and
# a note tells the model to match on the suffix. Prose renders as `search-content`.
mcp_prefix: ""

# Host-provided tools. render_native is a browser the model can drive, listed by
# base name because the host prefixes it. Checked 2026-10-08:
# - Chat and Code: Claude's built-in browser pane (mcp__Claude_Browser__*);
#   `navigate` opens the pane at a URL if it isn't open yet.
# - Cowork: no built-in pane, only Claude in Chrome (mcp__claude-in-chrome__*),
#   which drives the user's real Chrome and needs `tabs_context_mcp` first.
# Both share the base names navigate, computer, read_page, find,
# javascript_tool and resize_window. claude.ai web: VERIFY (likely neither).
# No node_repl or user-choice tool is assumed; prose falls back to a numbered list.
tools:
  render_native:
    - name: navigate
      context: Claude's built-in (in-app) browser
    - name: preview_start
      context: Claude's built-in (in-app) browser, opened in a new tab
  # Tool that approves a site for the browser pane. A site-approval prompt is
  # not a render failure: call this, then retry the browser step.
  site_access: request_access
  js_repl: ""
  elicit: ""

elicit_max_options: 4

# How to show the user an image file (e.g. a downloaded Tableau render).
# Chat and Cowork both preview a presented PNG file in the side panel; in
# Cowork the preview opens only once the user clicks the file card. A Markdown
# image of a local path shows only as a link (opening it prompts for a
# third-party app).
# Verified in Claude Desktop Chat and Cowork. VERIFY on claude.ai web.
show_image: >-
  present the downloaded PNG to the user as a file, so it opens in the
  side-panel preview, and tell them to click the file card if the preview
  doesn't open on its own

capabilities:
  # Offer the Tableau MCP server's render-interactive-viz tool as the first
  # render path. Set false to skip straight to the browser / static-image paths.
  interactive_viz: true
  native_render: true                 # render_native tools may exist on this host
  js_repl: false
  native_render_guaranteed: false     # the browser tool may be absent (e.g. web)
  shell_guaranteed: false
  # Download presigned render URLs only via shell curl/Python. Cowork's web
  # fetch rejects them (cowork_web_fetch_url_too_long). VERIFY on claude.ai web.
  shell_download_only: true
  # After publishing an edit that added interactivity, click through it in a
  # browser the model can drive (built-in pane in Chat/Code, Claude in Chrome in
  # Cowork). Both expose computer, read_page, find, javascript_tool and
  # resize_window by those base names.
  browser_verify: true

# Payload paths (globs relative to src/plugin/) not shipped on this platform.
exclude:
  - "skills/*/agents/openai.yaml"   # OpenAI-only skill metadata

# Size-reduced build for hosts with package limits (the Claude plugin
# directory times out validating the full ~25 MB package). Built with
# `build.py --slim`; published to the dist-claude-slim branch.
slim:
  # Globs match from the right, so "*.tbm" drops every chart template.
  exclude:
    - "*.tbm"
  # Keep only the newest N resources/schemas/<YYYY_R>/ versions.
  keep_latest_schemas: 2
