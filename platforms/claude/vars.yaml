# Claude platform variables: the Claude apps (web, Desktop Chat, Cowork), which
# share one plugin format (.claude-plugin/). Consumed by build/build.py when
# rendering *.j2 files from src/plugin/.
#
# Values tagged VERIFY still need confirming in a real Claude app install.

# How the assistant refers to itself in user-facing prose.
assistant_name: Claude

# Empty on purpose. In the Claude apps the Tableau connector's tools get a
# host-assigned prefix that isn't predictable from the plugin (e.g.
# mcp__<connector-uuid>__search-content), so skills name tools by base name and
# a note tells the model to match on the suffix. Prose renders as `search-content`.
mcp_prefix: ""

# Host-provided tools. render_native is the in-app browser: Claude's built-in
# browser pane, whose `navigate` tool opens the pane at a URL if it isn't open
# yet. Listed by base name; the host may prefix it (e.g. mcp__Claude_Browser__).
# VERIFY the tool name in Chat and Cowork. No node_repl or user-choice tool is
# assumed; prose falls back to a numbered list.
tools:
  render_native:
    - name: navigate
      context: Claude's built-in (in-app) browser
  js_repl: ""
  elicit: ""

elicit_max_options: 4

# How to show the user an image file (e.g. a downloaded Tableau render) inline
# in the chat. Markdown images of local paths render only as links in Claude
# Desktop/Cowork, and the visualize widget's CSP blocks remote image hosts
# (including Tableau's presigned URLs), but it does render `data:` images.
# Verified in Claude Desktop/Cowork. VERIFY on claude.ai web.
show_image: >-
  render it in a visualize widget (the host's `show_widget` tool; it may be
  listed with a prefix such as `mcp__visualize__show_widget`, and its
  `read_me` must be called once first) as an HTML `<img>` whose `src` is a
  base64 `data:image/png;base64,...` URI of the file (get the text with
  `base64 < "<file>" | tr -d '\n'`, or Python's `base64` module), with the view
  name as `alt` and `style="max-width:100%;height:auto"`. Keep the file under
  about 200 KB: if it's larger, call `get-view-image` once more for a display
  copy with `width` of at most 1000 that preserves the aspect ratio, and embed
  that. A Markdown image or link to the local path, a file attachment, or a side
  panel only shows a link in this host, so it doesn't count as showing the
  image. If no `show_widget` tool is available, embed it with Markdown
  (`![<view name>](/absolute/path/to/render.png)`) and tell the user the
  render couldn't be displayed inline here

capabilities:
  native_render: true                 # render_native tools may exist on this host
  js_repl: false
  native_render_guaranteed: false     # the browser tool may be absent (e.g. web)
  shell_guaranteed: false
  # Download presigned render URLs only via shell curl/Python. Cowork's web
  # fetch rejects them (cowork_web_fetch_url_too_long). VERIFY on claude.ai web.
  shell_download_only: true

# Payload paths (globs relative to src/plugin/) not shipped on this platform.
exclude:
  - "skills/*/agents/openai.yaml"   # OpenAI-only skill metadata
