# Grok platform variables: Grok CLI (`grok`) and Grok Bot desktop, which share
# ~/.grok and one plugin format (.grok-plugin/, per
# https://github.com/xai-org/plugin-marketplace). Consumed by build/build.py
# when rendering *.j2 files from src/plugin/.
#
# Values tagged VERIFY still need confirming in a Grok install.

# How the assistant refers to itself in user-facing prose.
assistant_name: Grok

# Empty on purpose. Grok names an MCP tool <server>__<tool>
# (Tableau__search-content, TableauTest__search-content on the test variant)
# and the model reaches it through the built-in search_tool / use_tool. Skills
# use the bare name and tell the model to match on the suffix. A non-empty
# prefix would be rewritten to mcp__<variant server>__ on test/stage/dev, which
# is not Grok's shape.
mcp_prefix: ""

# No host-provided viz browser, REPL, or option-picker is assumed (VERIFY).
tools:
  render_native: []
  site_access: ""
  js_repl: ""
  elicit: ""

elicit_max_options: 4

# How to show the user a local image file (e.g. a downloaded Tableau render).
# VERIFY that Grok Bot displays a Markdown image of a local path. The CLI's
# terminal UI shows it as text, so the path is still useful there.
show_image: >-
  embed it in the reply as a Markdown image that uses its absolute path, e.g.
  `![<view name>](/absolute/path/to/render.png)`, so the user sees the picture

capabilities:
  # Grok does not render MCP Apps UI (VERIFY), so skip render-interactive-viz
  # and go straight to the hyperlink plus static-image path.
  interactive_viz: false
  native_render: false
  js_repl: false
  native_render_guaranteed: false
  shell_guaranteed: false
  # Presigned view-image URLs are about 2,000 characters. Download them with
  # curl or Python in the shell rather than a web fetch tool. VERIFY in Grok Bot.
  shell_download_only: true
  browser_verify: false

# Payload paths (globs relative to src/plugin/) not shipped on this platform.
exclude:
  - "skills/*/agents/openai.yaml"   # OpenAI-only skill metadata
