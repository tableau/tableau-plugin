name: Publish Claude distribution

# Builds the Claude plugin from main and commits it to a dist branch, so
# consumers can install it without a build step:
# - dist/claude: the full build (e.g. for the Salesforce AI Marketplace).
# - dist-claude-slim: the size-reduced `--slim` build for the Claude plugin
#   directory, which times out validating the full package.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: claude, flags: "", branch: dist/claude }
          - { name: claude-slim, flags: "--slim", branch: dist-claude-slim }
    # Never run two publishes to one branch at once: each one appends to it.
    concurrency:
      group: publish-${{ matrix.name }}
      cancel-in-progress: false
    env:
      BUILD_FLAGS: ${{ matrix.flags }}
      DIST_DIR: dist/${{ matrix.name }}
      TARGET_BRANCH: ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install -r build/requirements.txt
          # Pin prod: test/stage/dev variants rename the plugin and repoint its MCP server.
          python3 build/build.py --variant prod $BUILD_FLAGS claude
          cp LICENSE.txt "$DIST_DIR/plugins/tableau/LICENSE.txt"

      - name: Commit to ${{ matrix.branch }}
        run: |
          set -euo pipefail
          SRC_SHA="$(git rev-parse HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null; then
            git worktree add -B "$TARGET_BRANCH" ../out "origin/$TARGET_BRANCH"
          else
            git worktree add --orphan -b "$TARGET_BRANCH" ../out
          fi

          rsync -a --delete --exclude .git "$DIST_DIR/" ../out/
          cd ../out
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to publish."
            exit 0
          fi
          git commit \
            -m "Build of main@${SRC_SHA:0:10}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SRC_SHA}"
          git push origin "$TARGET_BRANCH"
