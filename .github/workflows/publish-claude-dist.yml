name: Publish Claude distribution

# Builds the Claude plugin from main and commits it to the dist/claude branch,
# so consumers (e.g. the Salesforce AI Marketplace) can install it without a build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two publishes at once: each one appends to dist/claude.
concurrency:
  group: publish-claude-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install -r build/requirements.txt
          # Pin prod: test/stage/dev variants rename the plugin and repoint its MCP server.
          python3 build/build.py --variant prod claude
          cp LICENSE.txt dist/claude/plugins/tableau/LICENSE.txt

      - name: Commit to dist/claude
        run: |
          set -euo pipefail
          SRC_SHA="$(git rev-parse HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin dist/claude >/dev/null; then
            git worktree add -B dist/claude ../out origin/dist/claude
          else
            git worktree add --orphan -b dist/claude ../out
          fi

          rsync -a --delete --exclude .git dist/claude/ ../out/
          cd ../out
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to publish."
            exit 0
          fi
          git commit \
            -m "Build of main@${SRC_SHA:0:10}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SRC_SHA}"
          git push origin dist/claude
