name: Build

# Builds what publish-dist.yml ships, plus the test variant, on every PR, so a
# broken build can't merge. As a required check it also turns on "branch must
# be up to date", which makes auto-version-bump re-bump a PR after another
# one merges.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build every platform
        run: |
          pip install -r build/requirements.txt
          python3 build/build.py --variant prod
          python3 build/build.py --variant prod --slim claude
          python3 build/build.py --variant test

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check Desktop tool names in skills
        run: |
          if ! npm view @tableau/mcp-server-desktop version >/dev/null 2>&1; then
            echo "::notice::@tableau/mcp-server-desktop is not on npm yet; skipping the Desktop tool-name check."
            exit 0
          fi
          python3 build/check_desktop_tools.py
